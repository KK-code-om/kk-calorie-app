<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KK Calorie App V2</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json?v=2" />

  <meta name="theme-color" content="#202020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KK Calories" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <main class="app">
    <header class="topbar">
      <h1>KK Calories</h1>
      <div class="date-row">
        <button onclick="changeDay(-1)">←</button>
        <input id="datePicker" type="date" onchange="setDateFromPicker()" />
        <button onclick="changeDay(1)">→</button>
      </div>
    </header>

    <nav class="tabs">
      <button onclick="showTab('today')" class="tab active" id="tab-today">Šodien</button>
      <button onclick="showTab('foods')" class="tab" id="tab-foods">Produkti</button>
      <button onclick="showTab('weight')" class="tab" id="tab-weight">Svars</button>
      <button onclick="showTab('settings')" class="tab" id="tab-settings">Settings</button>
    </nav>

    <section id="today" class="screen active-screen">
      <section class="card summary">
        <h2>Dienas progress</h2>

        <div class="big-number">
          <span id="totalKcal">0</span>
          <small>/ <span id="targetKcal">1910</span> kcal</small>
        </div>

        <div class="bar"><div id="kcalBar"></div></div>
        <p class="remaining">Atlikums: <strong id="remainingKcal">1910</strong> kcal</p>

        <div class="macro">
          <label>Proteīns <span id="proteinText">0 / 130 g</span></label>
          <div class="bar small"><div id="proteinBar"></div></div>
        </div>

        <div class="macro">
          <label>Ogļhidrāti <span id="carbsText">0 / 190 g</span></label>
          <div class="bar small"><div id="carbsBar"></div></div>
        </div>

        <div class="macro">
          <label>Tauki <span id="fatText">0 / 70 g</span></label>
          <div class="bar small"><div id="fatBar"></div></div>
        </div>

        <div id="dailyStatus" class="status">OK</div>
      </section>

      <section class="card">
        <h2>Ātrā ievade</h2>
        <div id="quickButtons" class="quick-grid"></div>
      </section>

      <section class="card">
        <h2>Pievienot ēdienu</h2>

        <input id="foodName" placeholder="Ēdiens" />
        <input id="kcal" type="number" placeholder="kcal" />
        <input id="protein" type="number" step="0.1" placeholder="Proteīns g" />
        <input id="carbs" type="number" step="0.1" placeholder="Ogļhidrāti g" />
        <input id="fat" type="number" step="0.1" placeholder="Tauki g" />

        <select id="mealType">
          <option value="breakfast">Brokastis</option>
          <option value="lunch">Pusdienas</option>
          <option value="dinner">Vakariņas</option>
          <option value="snack">Uzkoda</option>
        </select>

        <button onclick="addFood()">Pievienot</button>
      </section>

      <section class="card">
        <h2>Ieraksti</h2>
        <div id="foodList"></div>
        <button class="danger" onclick="resetDay()">Reset selected day</button>
      </section>
    </section>

    <section id="foods" class="screen">
      <section class="card">
        <h2>Custom quick food</h2>

        <input id="qName" placeholder="Nosaukums" />
        <input id="qKcal" type="number" placeholder="kcal" />
        <input id="qProtein" type="number" step="0.1" placeholder="Proteīns g" />
        <input id="qCarbs" type="number" step="0.1" placeholder="Ogļhidrāti g" />
        <input id="qFat" type="number" step="0.1" placeholder="Tauki g" />

        <button onclick="saveQuickFood()">Saglabāt quick food</button>
      </section>

      <section class="card">
        <h2>Quick foods</h2>
        <div id="quickFoodList"></div>
      </section>
    </section>

    <section id="weight" class="screen">
      <section class="card">
        <h2>Svars</h2>
        <input id="weightInput" type="number" step="0.1" placeholder="Svars kg" />
        <button onclick="saveWeight()">Saglabāt svaru</button>
        <p id="lastWeight"></p>
      </section>

      <section class="card">
        <h2>Svara vēsture</h2>
        <canvas id="weightChart" width="320" height="180"></canvas>
        <div id="weightList"></div>
      </section>
    </section>

    <section id="settings" class="screen">
      <section class="card">
        <h2>KK mērķi</h2>

        <label>kcal/dienā</label>
        <input id="setKcal" type="number" />

        <label>Proteīns g/dienā</label>
        <input id="setProtein" type="number" />

        <label>Ogļhidrāti g/dienā</label>
        <input id="setCarbs" type="number" />

        <label>Tauki g/dienā</label>
        <input id="setFat" type="number" />

        <label>Ūdens mērķis ml</label>
        <input id="setWater" type="number" />

        <button onclick="saveSettings()">Saglabāt settings</button>
      </section>

      <section class="card">
        <h2>Datu rezerves kopija</h2>
        <button onclick="exportData()">Export JSON</button>
        <textarea id="backupBox" placeholder="Šeit parādīsies backup / šeit var ielīmēt importu"></textarea>
        <button onclick="importData()">Import JSON</button>
        <button class="danger" onclick="resetAllData()">Reset ALL data</button>
      </section>
    </section>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
